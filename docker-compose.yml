

services:
  db:
    container_name: ${POSTGRES_HOST}
    hostname: ${POSTGRES_HOST}
    image: postgres:latest
    env_file:
      - ./.env
    ports:
      - '${POSTGRES_PORT}:${POSTGRES_PORT}'
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # volumes:
    #   - ./postgres-data:/var/lib/postgresql/data
    networks:
      - network_name

  backend:
    container_name: ${BACKEND_HOST}
    hostname: ${BACKEND_HOST}
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - ./.env
    environment:
      - BACKEND_HOST=${BACKEND_HOST}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/backend/app
    networks:
      - network_name
    healthcheck:
      test: ["CMD", "curl", "-f", "http://${BACKEND_HOST}:8080/api/v1/health_check/ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  frontend:
    container_name: ${FRONTEND_HOST}
    hostname: ${FRONTEND_HOST}
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - '8081:80' 
    env_file:
      - ./.env
    environment:
      - VUE_APP_BACKEND_URL=http://${BACKEND_HOST}:8080 
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/frontend        # Монтируем всю директорию фронтенда для синхронизации изменений
      - /frontend/node_modules      # Анонимный том для node_modules внутри контейнера
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network_name

networks:
  network_name: